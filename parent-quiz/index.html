<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Answer a few questions about your child and get a personal, year-by-year track to a top university.">
<title>Your child's personal track | ATMO School</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: the quiz only, in one 592px column under a centred logo and segmented progress. Type, radii and blue/yellow from atmo-school.com. Yellow marker on the key phrase is the one highlight device. */
:root {
  --bg:#ffffff; --fg:#0b1437; --text:#3a4668; --muted:#56607a; --tint:#eef3ff; --tint-2:#dce7ff; --field:#b4bfda; --surface:#ffffff;
  --accent:#1e4fcc; --accent-hover:#183fa3; --on-accent:#ffffff; --glow:rgba(30,79,204,.32);
  --yellow:#ffc53d; --on-yellow:#0b1437; --deep:#0b1437; --on-deep:#ffffff; --on-deep-2:#d3dbee; --err:#b3261e;
  --logo-a:#1b2a55; --logo-o:#2a5dbc;
  --head:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0b1437; --fg:#eef3ff; --text:#d3dbee; --muted:#a7b3d1; --tint:#16214d; --tint-2:#2a3770; --field:#46538c; --surface:#16214d;
  --accent:#8fb3ff; --accent-hover:#a9c5ff; --on-accent:#0b1437; --glow:rgba(143,179,255,.32);
  --deep:#16214d; --err:#ff9a8f; --logo-a:#f6f3ec; --logo-o:#8fb3ff; color-scheme:dark; } }
:root[data-theme="dark"] {
  --bg:#0b1437; --fg:#eef3ff; --text:#d3dbee; --muted:#a7b3d1; --tint:#16214d; --tint-2:#2a3770; --field:#46538c; --surface:#16214d;
  --accent:#8fb3ff; --accent-hover:#a9c5ff; --on-accent:#0b1437; --glow:rgba(143,179,255,.32);
  --deep:#16214d; --err:#ff9a8f; --logo-a:#f6f3ec; --logo-o:#8fb3ff; color-scheme:dark; }
* { box-sizing:border-box; }
html,body { background:var(--bg); }
body { color:var(--fg); font:400 16px/1.5 var(--body); -webkit-font-smoothing:antialiased; }
h2,h3,p { margin:0; }
button,input,select { font:inherit; }
a { color:var(--accent); }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
mark { background:var(--yellow); color:var(--on-yellow); padding:.02em .2em; border-radius:.26em; -webkit-box-decoration-break:clone; box-decoration-break:clone; }
.col { max-width:592px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:10; background:var(--bg); }
.bar { position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; background:var(--bg); }
.bar .col { padding-block:10px 12px; display:grid; gap:8px; }
.bar-top { display:grid; grid-template-columns:44px 1fr 44px; align-items:center; }
.ib { width:44px; height:44px; display:grid; place-items:center; border:0; background:none; color:var(--fg); cursor:pointer; border-radius:12px; }
.ib svg { width:24px; height:24px; }
.logo { justify-self:center; display:inline-flex; align-items:center; gap:7px; font:700 17px/1 var(--head); letter-spacing:-.02em; }
.logo svg { width:32px; height:28px; display:block; }
.m-a { fill:var(--logo-a); } .m-o { fill:var(--logo-o); }
.sec { font-size:14px; font-weight:600; color:var(--muted); text-align:center; }
.segs { display:flex; gap:4px; }
.seg { flex:1; height:6px; border-radius:999px; background:var(--tint); overflow:hidden; }
.seg i { display:block; height:100%; border-radius:999px; background:var(--accent); transition:width .25s; }

#q { padding-block:20px 56px; display:grid; gap:18px; }
#q > * { min-width:0; }
@media (prefers-reduced-motion: no-preference) { #q.in > * { animation:rise .2s ease-out; } }
@keyframes rise { from { transform:translateY(6px); } to { transform:none; } }
h2 { font:700 clamp(23px, 5vw, 29px)/1.2 var(--head); letter-spacing:-.025em; text-wrap:balance; }
h3 { font:700 18px/1.25 var(--head); letter-spacing:-.02em; }
.eyebrow { font-size:13px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
.hint { color:var(--muted); margin-top:-8px; }
.opts { display:grid; gap:10px; }
.opt { display:flex; align-items:center; gap:12px; width:100%; min-height:58px; padding:12px 18px; text-align:left; background:var(--tint); color:var(--fg); border:2px solid var(--tint); border-radius:14px; font-weight:600; cursor:pointer; transition:border-color .12s, background .12s; }
.opt:hover:not(:disabled) { border-color:var(--accent); }
.opt[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.opt:disabled { cursor:default; }
.opt small { display:block; margin-top:2px; font-size:14px; font-weight:400; color:var(--muted); }
.opt[aria-pressed="true"] small, .opt[aria-pressed="true"] .h, .opt[aria-pressed="true"] .k { color:var(--on-accent); }
.opt .tx { flex:1; min-width:0; }
.opt .k { flex:none; font:700 15px/1 var(--head); color:var(--accent); width:20px; }
.agree { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.agree .opt { justify-content:center; text-align:center; padding:10px 6px; }
.quote { background:var(--tint); border-radius:22px; padding:24px; font:500 clamp(18px, 4vw, 21px)/1.35 var(--head); letter-spacing:-.02em; }
.btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; min-height:60px; padding:12px 20px; border:0; border-radius:14px; background:var(--accent); color:var(--on-accent); font-size:17px; font-weight:700; cursor:pointer; }
.btn:hover { background:var(--accent-hover); }
.btn svg { width:20px; height:20px; }

/* First screen */
.intro { display:grid; justify-items:center; text-align:center; gap:18px; padding-top:8px; }
.crowd { position:relative; display:flex; align-items:center; justify-content:center; height:170px; }
.ava { display:block; border-radius:50%; box-shadow:0 0 0 6px var(--bg); }
.ava.s { width:112px; height:112px; }
.ava.l { width:150px; height:150px; margin-inline:-14px; position:relative; z-index:1; }
.badge { position:absolute; z-index:2; top:2px; right:-14px; rotate:6deg; padding:8px 14px; border-radius:999px; background:var(--yellow); color:var(--on-yellow); font:700 15px/1 var(--head); letter-spacing:-.02em; white-space:nowrap; }
.intro h2 { font-size:clamp(30px, 7.4vw, 42px); line-height:1.16; letter-spacing:-.035em; }
.intro p { color:var(--muted); font-size:18px; max-width:30em; }
.pills { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; }
.pills span { display:inline-flex; align-items:center; gap:8px; padding:10px 15px; border-radius:999px; background:var(--tint); font-size:15px; font-weight:500; }
.pills svg { width:18px; height:18px; color:var(--accent); }
.go-big { border-radius:999px; min-height:66px; margin-top:6px; box-shadow:0 14px 30px -10px var(--glow); }
@media (prefers-reduced-motion: no-preference) { .badge { animation:bob 3.2s ease-in-out infinite; } }
@keyframes bob { 50% { translate:0 -5px; } }

/* Statistics */
.big { font:700 clamp(72px, 19vw, 104px)/1 var(--head); letter-spacing:-.04em; color:var(--accent); font-variant-numeric:tabular-nums; }
.big small { font:500 20px/1 var(--head); letter-spacing:-.02em; color:var(--muted); margin-left:4px; }
.grid100 { display:grid; grid-template-columns:repeat(20,1fr); gap:5px; }
.grid100 i { aspect-ratio:1; border-radius:50%; background:var(--tint-2); }
.grid100 i.on { background:var(--accent); } .grid100 i.mid { background:var(--yellow); }
.key { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:14px; color:var(--muted); }
.key span { display:inline-flex; align-items:center; gap:6px; }
.key i { width:11px; height:11px; border-radius:50%; background:var(--tint-2); }
.key i.on { background:var(--accent); } .key i.mid { background:var(--yellow); }
.src { font-size:14px; color:var(--muted); }
.say { font-size:18px; line-height:1.45; }
.ans { font-size:15px; color:var(--muted); }
.hb { display:grid; gap:14px; }
.hb .lab { display:flex; justify-content:space-between; gap:12px; font-size:15px; margin-bottom:5px; }
.hb .lab b { font-weight:700; white-space:nowrap; }
.hb .tr { height:14px; border-radius:999px; background:var(--tint); overflow:hidden; }
.hb .tr i { display:block; height:100%; border-radius:999px; background:var(--accent); }
.hb .tr i.y { background:var(--yellow); }
.blocks { display:grid; grid-template-columns:repeat(15,1fr); gap:5px; }
.blocks i { height:30px; border-radius:6px; background:var(--tint-2); }
.blocks i.y { background:var(--yellow); }
.figs { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.figs div { background:var(--tint); border-radius:16px; padding:18px 16px; }
.figs b { display:block; font:700 clamp(30px, 8vw, 40px)/1.05 var(--head); letter-spacing:-.03em; color:var(--accent); }
.figs span { display:block; font-size:15px; line-height:1.35; margin-top:8px; }
.dark { background:var(--deep); color:var(--on-deep); border-radius:22px; padding:28px 24px; display:grid; gap:18px; }
.dark h2 { color:var(--on-deep); }
.proof3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
.proof3 b { display:block; font:700 clamp(26px, 6vw, 34px)/1.05 var(--head); letter-spacing:-.03em; color:var(--yellow); }
.proof3 span { display:block; font-size:14px; line-height:1.3; margin-top:6px; color:var(--on-deep-2); }
.dark p { color:var(--on-deep-2); font-size:15px; }
.gaprow { display:grid; grid-template-columns:minmax(0,1fr) 44px 44px; gap:10px; align-items:center; width:100%; }
.gaprow .h { display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:2px; text-align:center; }
.gaprow .v { display:block; font:700 20px/1 var(--head); text-align:center; }

/* Snapshot, loading */
.snap { background:var(--tint); border-radius:22px; padding:22px; display:grid; gap:14px; }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip { padding:6px 12px; border-radius:999px; background:var(--bg); font-size:14px; font-weight:600; }
.snap-q { display:flex; align-items:center; justify-content:space-between; gap:12px; font-weight:600; border-top:1px solid var(--tint-2); padding-top:14px; }
.snap-q b { font:700 34px/1 var(--head); color:var(--accent); }
.ticks { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
.ticks li { display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:14px; background:var(--tint); color:var(--muted); font-weight:500; }
.ticks li i { width:20px; height:20px; border-radius:50%; flex:none; background:var(--tint-2); display:grid; place-items:center; color:transparent; }
.ticks li.done { color:var(--fg); }
.ticks li.done i { background:var(--accent); color:var(--on-accent); }
.ticks svg { width:12px; height:12px; }
.loader { display:grid; justify-items:center; gap:18px; text-align:center; padding-top:8px; }
.loader .ticks { width:100%; text-align:left; }
.ringw { position:relative; width:190px; height:190px; }
.ringw svg { width:100%; height:100%; transform:rotate(-90deg); display:block; }
.ringw circle { fill:none; stroke-width:10; }
.ringw .bg { stroke:var(--tint); }
.ringw .fg { stroke:var(--accent); stroke-linecap:round; }
.ringw b { position:absolute; inset:0; display:grid; place-items:center; font:700 44px/1 var(--head); letter-spacing:-.03em; font-variant-numeric:tabular-nums; }
.loader .now-doing { color:var(--muted); min-height:24px; }
.subs { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.subs .opt { min-height:48px; padding:8px 12px; font-size:15px; }
.checkrows { display:grid; gap:10px; }
.checkrow { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 16px; border-radius:14px; background:var(--tint); font-weight:600; }
.checkrow span { flex:none; padding:4px 10px; border-radius:999px; font-size:13px; font-weight:700; }
.checkrow .ok { background:var(--accent); color:var(--on-accent); }
.checkrow .no { background:var(--yellow); color:var(--on-yellow); }

/* Result */
.ba { display:grid; grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr); gap:6px; align-items:center; }
.ba > div { border-radius:18px; padding:16px; align-self:stretch; display:grid; gap:6px; align-content:start; }
.ba .now { background:var(--tint); }
.ba .then { background:var(--yellow); color:var(--on-yellow); }
.ba small { font-size:13px; font-weight:600; opacity:.8; }
.ba b { font:700 21px/1.15 var(--head); letter-spacing:-.02em; }
.ba ul { list-style:none; margin:4px 0 0; padding:0; display:grid; gap:4px; font-size:14px; line-height:1.3; }
.ba .arrow { color:var(--accent); display:grid; place-items:center; }
.ba .arrow svg { width:22px; height:22px; }
.tiles { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.tiles div { background:var(--tint); border-radius:16px; padding:14px 16px; }
.tiles small { display:block; font-size:13px; color:var(--muted); }
.tiles b { font-weight:700; line-height:1.3; }
.risks { display:grid; gap:10px; }
.risk { border:2px solid var(--tint-2); border-radius:16px; padding:14px 16px; }
.risk strong { display:block; font-weight:700; line-height:1.3; }
.risk p { font-size:15px; line-height:1.4; color:var(--text); margin-top:3px; }
.locked { filter:blur(5px); user-select:none; }
.tk-box { border:2px solid var(--tint-2); border-radius:22px; padding:22px 20px; }
.tk { list-style:none; margin:0; padding:0; position:relative; display:grid; gap:16px; }
.tk::before { content:""; position:absolute; left:10px; top:8px; bottom:12px; width:2px; background:var(--tint-2); }
.tk li { position:relative; padding-left:36px; }
.tk li::before { content:""; position:absolute; left:2px; top:3px; width:18px; height:18px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px var(--bg); }
.tk li.goal::before { background:var(--yellow); }
.tk small { display:block; font-size:13px; font-weight:600; color:var(--muted); }
.tk strong { display:block; font-weight:700; line-height:1.3; }
.tk p { font-size:15px; line-height:1.4; color:var(--text); margin-top:2px; }
form { display:grid; gap:12px; scroll-margin-top:130px; }
.fld { display:grid; gap:5px; }
.fld label { font-size:14px; font-weight:600; }
.fld input,.fld select { width:100%; height:48px; padding:0 14px; background:var(--surface); color:var(--fg); border:1px solid var(--field); border-radius:10px; font-size:16px; }
.err { font-size:14px; font-weight:600; color:var(--err); }
.fine { font-size:13px; line-height:1.45; color:var(--muted); }
.note { background:var(--tint); border-radius:14px; padding:14px 16px; font-size:15px; color:var(--text); }
.review { background:var(--tint); border-radius:22px; padding:22px; display:grid; gap:10px; }
.review p { font-size:17px; line-height:1.45; }
.review span { font-size:14px; color:var(--muted); }
.review b { font-weight:700; }
@media (max-width:400px) { .ava.l { width:128px; height:128px; } .ava.s { width:96px; height:96px; } .crowd { height:150px; } .badge { right:-8px; } }
</style>

<script>

      const C = 2 * Math.PI * 80, DUR = 3800;
      q.innerHTML = `<div class="loader"><h2>Analysing your answers</h2>
        <div class="ringw"><svg viewBox="0 0 190 190" aria-hidden="true"><circle class="bg" cx="95" cy="95" r="80"/><circle class="fg" id="fg" cx="95" cy="95" r="80" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><b id="pct">0%</b></div>
        <ul class="ticks">${items.map(t => `<li><i>${TICK}</i>${t}</li>`).join('')}</ul></div>`;
      const fg = q.querySelector('#fg'), pct = q.querySelector('#pct'), lis = q.querySelectorAll('.ticks li'), t0 = performance.now();
      const frame = now => {
        if (STEPS[i] !== s) return;
        const p = Math.min(1, (now - t0) / DUR), v = Math.round(p * 100);
        pct.textContent = v + '%';
        fg.setAttribute('stroke-dashoffset', C * (1 - p));
        lis.forEach((li, k) => li.classList.toggle('done', v >= [30,65,100][k]));
        if (p < 1) requestAnimationFrame(frame); else timer = setTimeout(next, 450);
      };
      requestAnimationFrame(frame);
    }
    if (s.type === 'form') renderForm();
  }

  function renderForm(){
    const n = score(), r = risks(), count = r.length + ' risks';
    const tiles = `<div class="tiles"><div><small>Goal</small><b>${GOAL[st.dir]}</b></div><div><small>Best fit</small><b>${PROGRAMME[st.teach]}</b></div></div>`;
    q.innerHTML = `<span class="eyebrow">Your child's track is ready</span>
      <h2>We found <mark>${count}</mark> on your child's route</h2>
      <div class="ba">
        <div class="now"><small>Today</small><b>${n}/100</b><ul><li>${r[0][0]}</li></ul></div>
        <span class="arrow">${ARROW}</span>
        <div class="then"><small>With a track</small><b>Clear plan</b><ul><li>Every risk has a fix and a date</li></ul></div>
      </div>
      ${tiles}
      <button class="btn" id="jump" type="button">Unlock the fixes${ARROW}</button>
      <h3>The risks, and how to fix them</h3>${risksHTML(true)}
      <h3>Your child's track to ${YEARS.y13}</h3><div class="tk-box">${trackHTML(true)}</div>
      <p class="src">The score shows how much of the route has been checked. It does not measure your child's ability.</p>
      <h2>Get every fix and the full track on a free call</h2>
      <form id="lead" novalidate>
        <div class="fld"><label for="ln">Your name</label><input id="ln" autocomplete="name"></div>
        <div class="fld"><label for="le">Email</label><input id="le" type="email" autocomplete="email"></div>
        <div class="fld"><label for="lp">Mobile phone</label><input id="lp" type="tel" autocomplete="tel"></div>
        <div class="fld"><label for="ly">Child's year group</label><select id="ly">${Object.entries(YEARS).map(([v,t]) => `<option value="${v}"${v === st.year ? ' selected' : ''}>${t}</option>`).join('')}</select></div>
        <p class="err" id="ferr" role="alert" hidden></p>
        <button class="btn" type="submit">Request a free call${ARROW}</button>
        <p class="fine">14-day money-back guarantee on enrolment. ${CONSENT}</p>
      </form>
      <div class="review"><p>“As a parent, I was skeptical about online education. But ATMO School exceeded all expectations. The progress reports and parent communication were exceptional.”</p><span><b>Emma Rodriguez</b> · Daughter accepted to LSE</span></div>`;
    q.querySelector('#jump').onclick = () => { const f = q.querySelector('#lead'); f.scrollIntoView({behavior:'smooth', block:'start'}); q.querySelector('#ln').focus({preventScroll:true}); };
    q.querySelector('#lead').onsubmit = e => {
      e.preventDefault();
      const v = id => q.querySelector(id).value.trim(), err = q.querySelector('#ferr');
      const name = v('#ln'), email = v('#le'), phone = v('#lp');
      const msg = !name ? 'Enter your name.' : !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) ? 'Enter a valid email address, such as name@example.com.' : phone.replace(/\D/g,'').length < 10 ? 'Enter a mobile number with the country code, so an advisor can call you.' : '';
      if (msg) { err.textContent = msg; err.hidden = false; return; }
      err.hidden = true;
      const btn = q.querySelector('#lead button[type=submit]'), label = btn.innerHTML;
      btn.disabled = true; btn.textContent = 'Sending…';
      sendLead({ name, email, phone, year: q.querySelector('#ly').value, score: n, risks: r.map(x => x[0]), answers: { ...st } }).then(() => {
        q.innerHTML = `<h2>Thank you, ${esc(name.split(' ')[0])}. Here is the full track.</h2><p class="say">An advisor will call you to go through it. Want to pick a time yourself?</p><a class="btn" style="text-decoration:none" href="https://meetings-eu1.hubspot.com/kpishchakova" target="_blank" rel="noopener">Choose a time for the call${ARROW}</a>${tiles}<h3>The risks, and how to fix them</h3>${risksHTML(false)}<div class="tk-box">${trackHTML(false)}</div>`;
        window.scrollTo(0,0);
        document.getElementById('back').style.visibility = 'hidden';
      }).catch(() => {
        btn.disabled = false; btn.innerHTML = label;
        err.textContent = "Sorry, that didn't send. Please try again, or call +44 7441 429616."; err.hidden = false;
      });
    };
  }

  document.getElementById('back').onclick = () => {
    if (i > 0) { do { i--; } while (i > 0 && (!active(STEPS[i]) || STEPS[i].type === 'load')); render(); }
  };
  render();
})();
</script>

</body>
</html>
